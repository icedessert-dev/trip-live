<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Daybook</title>
<style>
:root{--bg:#f7f5f0;--ink:#1d1b16;--muted:#6b665c;--line:#ddd8cc;--accent:#2f5d50;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--ink:#ecebe6;--muted:#a19d93;--line:#34322d;--accent:#8cc5b2;--bad:#f2b8b5}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:420px;margin:12vh auto 0;padding:0 16px}
h1{font-size:22px;margin:0 0 6px}p{color:var(--muted);margin:0 0 18px}
form{display:flex;flex-direction:column;gap:10px}
input{font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:var(--ink)}
button{font:inherit;font-weight:700;padding:12px 14px;border:0;border-radius:10px;background:var(--accent);color:var(--bg);cursor:pointer}
button[disabled]{opacity:.6}
label.k{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}
.err{color:var(--bad);min-height:1.5em;margin:0}
</style>
</head>
<body>
<main>
<h1>Daybook</h1>
<p>This page is locked. Enter the passphrase to open it.</p>
<form id="f" autocomplete="off">
<input id="p" type="password" placeholder="Passphrase" aria-label="Passphrase" autocomplete="current-password">
<label class="k"><input id="r" type="checkbox" checked> Remember on this device</label>
<button id="b" type="submit">Open</button>
<p class="err" id="e" aria-live="polite"></p>
</form>
</main>
<script>
(async()=>{
const $=id=>document.getElementById(id), d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let box=null; async function load(){ if(!box){const r=await fetch("app.json",{cache:"no-store"}); box=await r.json();} return box; }
async function open(key){ const b=await load(); const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d(b.iv)},key,d(b.ct)); const html=new TextDecoder().decode(pt); document.open(); document.write(html); document.close(); }
async function keyFrom(pass){ const b=await load(); const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]); return crypto.subtle.deriveKey({name:"PBKDF2",salt:d(b.salt),iterations:b.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]); }
try{ const saved=localStorage.getItem("daybook_k"); if(saved){ const k=await crypto.subtle.importKey("jwk",JSON.parse(saved),{name:"AES-GCM"},true,["decrypt"]); try{ await open(k); return; }catch(e){ localStorage.removeItem("daybook_k"); } } }catch(e){}
$("f").addEventListener("submit",async ev=>{ ev.preventDefault(); const pass=$("p").value; if(!pass) return; $("b").disabled=true; $("e").textContent="Unlocking…";
  try{ const k=await keyFrom(pass); await crypto.subtle.decrypt({name:"AES-GCM",iv:d(box.iv)},k,d(box.ct)); if($("r").checked){ try{ localStorage.setItem("daybook_k",JSON.stringify(await crypto.subtle.exportKey("jwk",k))); }catch(e){} } await open(k); }
  catch(e){ $("e").textContent=(e&&e.name==="OperationError")?"That passphrase doesn't open it.":"Couldn't load the page – check your connection."; $("b").disabled=false; }
});
$("p").focus();
})();
</script>
</body>
</html>
